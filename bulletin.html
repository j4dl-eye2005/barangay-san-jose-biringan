<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Opening Public Records | Barangay San Jose</title>
    <script>
        (() => {
            const category = new URLSearchParams(window.location.search).get('category') || '';
            const safeCategory = /^[1-4]$/.test(category) ? category : '';
            const destination = new URL('index.php', window.location.href);
            destination.hash = 'bulletin' + (safeCategory ? '?category=' + safeCategory : '');
            window.location.replace(destination.href);
        })();
    </script>
    <meta http-equiv="refresh" content="0;url=index.php#bulletin">
</head>
<body>
    <p>Opening the current Public Records page… <a href="index.php#bulletin">Continue to Public Records</a></p>
</body>
</html>
